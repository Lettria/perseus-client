[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perseus-client"
version = "1.0.0rc18"
authors = [
  { name="Victor de La Salmonière", email="victor@lettria.com" },
]
description = "A Python client for Perseus API"
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp",
    "pydantic",
    "pydantic-settings",
    "certifi",
    "rdflib",
    "rich"
]

[project.urls]
"Homepage" = "https://github.com/pypa/sampleproject"
"Bug Tracker" = "https://github.com/pypa/sampleproject/issues"

[project.optional-dependencies]
neo4j = ["neo4j"]
falkordb = ["falkordb"]
all = ["neo4j", "falkordb"]
test = [
    "pytest",
    "pytest-cov",
    "requests-mock",
    "Faker",
    "pytest-asyncio"
]

[tool.setuptools]
packages = ["perseus_client"]