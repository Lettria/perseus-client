services:
  # Graph Database
  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=neo4j/j4oenj4oen
      - NEO4J_PLUGINS=["apoc"]
    networks:
      - main_local
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # API
      - "6334:6334" # gRPC
    networks:
      - main_local
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

networks:
  main_local:
    driver: bridge

volumes:
  neo4j_data:
  qdrant_data:
  minio_data:
