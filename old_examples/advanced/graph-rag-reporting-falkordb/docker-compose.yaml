services:
  # Graph Database
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379" # Standard Redis/FalkorDB port
      - "3000:3000" # FalkorDB Web UI
    environment:
      - REDIS_ARGS=--requirepass bdroklaf --appendonly yes use
    networks:
      - main_local
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  # Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # API
      - "6334:6334" # gRPC
    networks:
      - main_local
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Text Embeddings Inference (TEI)
  tei_embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    ports:
      - "8080:80"
    environment:
      - MODEL_ID=BAAI/bge-small-en-v1.5
      - REVISION=main
    networks:
      - main_local
    restart: unless-stopped

networks:
  main_local:
    driver: bridge

volumes:
  falkordb_data:
  qdrant_data:
  minio_data:
